name: Apply scroll navigation fix

on:
  push:
    paths:
      - '.github/workflows/apply-scroll-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch custom scroll height calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('proto.html')
          text = path.read_text(encoding='utf-8')

          old_scroll = 'var maxScroll=document.documentElement.scrollHeight-window.innerHeight;'
          new_scroll = 'var maxScroll=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)-window.innerHeight;'

          old_progress = 'var max=document.documentElement.scrollHeight-window.innerHeight;'
          new_progress = 'var max=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)-window.innerHeight;'

          if text.count(old_scroll) != 1:
              raise SystemExit(f'Expected 1 custom-scroll height expression, found {text.count(old_scroll)}')
          if text.count(old_progress) != 1:
              raise SystemExit(f'Expected 1 progress height expression, found {text.count(old_progress)}')

          text = text.replace(old_scroll, new_scroll)
          text = text.replace(old_progress, new_progress)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixed page and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proto.html .github/workflows/apply-scroll-fix.yml
          git rm .github/workflows/apply-scroll-fix.yml
          git commit -m 'Fix custom scroll section navigation [skip ci]'
          git push
